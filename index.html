<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>مكتب الرسالة v3 – إدارة رسائل الدكتوراه والتحقق منها والبحث الأكاديمي</title>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Arabic:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
</head>
<body>
<header>
 <div class="hrow">
  <div><h1>🎓 مكتب الرسالة <span class="ver">v3</span></h1><p>إدارة رسائل الدكتوراه · التحقق من صحة المراجع · مدخل البحث الأكاديمي</p></div>
  <div class="pbar">
    <select id="psel" aria-label="اختيار المشروع"></select>
    <button class="hbtn" id="newp">+ جديد</button>
    <button class="hbtn" id="renp">تسمية</button>
    <button class="hbtn" id="delp">حذف</button>
    <button class="hbtn" id="thm" title="تبديل المظهر">🖥️</button>
    <span id="saved" aria-live="polite">✓</span>
  </div>
 </div>
 <nav role="tablist" id="nav"></nav>
</header>
<main id="main"></main>
<div id="toast" role="status"></div>
<script src="app.js"></script>
</body>
</html>
